<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Rate & Win</title>
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ✅ Header copied from homepage -->
  <header class="header">
    <div class="logo" onclick="location.href='index.html'" style="cursor:pointer">
      <img src="img/logo.png" alt="Rate & Win Logo">
      <h2>Rate & Win</h2>
    </div>
    <button class="hamburger" onclick="toggleMenu()">&#9776;</button>
    <nav class="desktop-nav">
      <a href="index.html">Home</a>
      <a href="restaurant.html">Restaurants</a>
      <a href="rewards.html">Rewards</a>
      <a href="register-restaurant.html">Register Restaurant</a>
    </nav>
    <div class="auth-buttons">
      <button onclick="location.href='profile.html'">View Profile</button>
      <button id="logoutBtn">Logout</button>
    </div>
    <div class="mobile-nav" id="mobileNav">
       <a href="index.html">Home</a>
      <a href="restaurant.html">Restaurants</a>
      <a href="rewards.html">Rewards</a>
      <a href="register-restaurant.html">Register Restaurant</a>
      <button onclick="location.href='profile.html'">View Profile</button>
      <button onclick="logout()">Logout</button>
    </div>
  </header>

  <!-- ✅ Main Content -->
  <main class="dashboard-main">
    <section class="hero">
      <h2>Hello, <span id="userName">User</span>! 🎉</h2>
      <p>Welcome back to Rate & Win. Share your experience and earn rewards.</p>
      <button onclick="location.href='ratings.html'">Rate Restaurants</button>
    </section>

    <section class="dashboard-links">
      <h3>Quick Links</h3>
      <div class="link-buttons">
        <a href="profile.html" class="btn">My Profile</a>
        <a href="rewards.html" class="btn">My Rewards</a>
        <a href="rating-hitory.html" class="btn">Rating History</a>
      </div>
    </section>

    <!-- ✅ Recently Rated Restaurant Cards -->
    <section class="ratings-section">
      <h3>Recently Rated</h3>
      <div class="restaurant-cards" id="recentRatings">
        <!-- Cards dynamically populated -->
      </div>
    </section>
  </main>

  <!-- ✅ Footer copied from homepage -->
  <footer class="footer">
    <p>&copy; 2025 Rate & Win. All rights reserved</p>
  </footer>

  <!-- ✅ JavaScript Logic -->
   <script src="js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const user = JSON.parse(localStorage.getItem("loggedInUser"));
      const userNameSpan = document.getElementById("userName");

      if (!user) {
        alert("You must be logged in to access this page.");
        window.location.href = "login.html";
        return;
      }

      userNameSpan.textContent = user.fullName || user.username;

      document.getElementById("logoutBtn").addEventListener("click", () => {
        localStorage.removeItem("loggedInUser");
        window.location.href = "login.html";
      });

      // ✅ Populate restaurant cards
      fetch('data/restaurants.json')
        .then(response => response.json())
        .then(data => {
          const container = document.getElementById("recentRatings");
          data.forEach(item => {
            const card = document.createElement('div');
            card.className = "card";
            card.innerHTML = `
              <img src="${item.image}" alt="${item.restaurant}" />
              <h4>${item.name}</h4>
              <p><strong>Rated by:</strong> ${item.latestReview.user}</p>
              <p><strong>Comment:</strong> ${item.latestReview.comment}</p>
              <p><strong>Rating:</strong> ${item.rating} ⭐</p>
            `;
            container.appendChild(card);
          });
        })
        .catch(error => console.error("Error loading restaurant data:", error));
    });
  </script>
</body>
</html>
