<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Rate & Win</title>
  <link rel="stylesheet" href="css/resetpassword.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ✅ Header from homepage -->
  <header class="header">
    <div class="logo" onclick="location.href='index.html'" style="cursor:pointer">
      <img src="img/logo.png" alt="Rate & Win Logo">
      <h2>Rate & Win</h2>
    </div>
     <button class="hamburger" onclick="toggleMenu()">&#9776;</button>
    <nav class="desktop-nav">
      <a href="index.html">Home</a>
      <a href="restaurants.html">Restaurants</a>
      <a href="rewards.html">Rewards</a>
    </nav>
    <div class="auth-buttons">
            <button onclick="location.href='login.html'" class="btn">Sign in</button>
            <button onclick="location.href='signup.html'" class="btn">Sign up</button>
        </div>
        <div class="mobile-nav" id="mobileNav">
      <a href="dashboard.html">Dashboard</a>
      <a href="restaurants.html">Restaurants</a>
      <a href="rewards.html">Rewards</a>
     <button onclick="location.href='login.html'">Sign in</button>
      <button onclick="location.href='signup.html'">Sign up</button>
    </div>
  </header>

  <div class="container">
    <div class="reset-box">
      <h3>Reset Your Password</h3>
      <p>Enter your email address or username and we'll send you instructions to reset your password.</p>

      <form id="resetForm">
        <label for="email">Email or Username</label>
        <input type="text" id="email" name="email" required>

        <button type="submit" class="btn">Send Reset Link</button>

        <div class="back-link">
          <a href="login.html">Back to Login</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.getElementById("resetForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();

      const users = JSON.parse(localStorage.getItem("users")) || [];
      const exists = users.find(
        (user) => user.email.toLowerCase() === email.toLowerCase() || user.username.toLowerCase() === email.toLowerCase()
      );

      if (exists) {
        alert("A reset link has been sent to your email (simulated).");
      } else {
        alert("No account found with that email or username.");
      }
    });
    function toggleMenu() {
      document.getElementById("mobileNav").classList.toggle("active");
    }
  </script>
</body>
</html>
