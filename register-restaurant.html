<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Restaurant - Rate & Win</title>
  <link rel="stylesheet" href="css/register-restaurant.css" />
 <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="logo" onclick="location.href='index.html'">
      <img src="img/logo.png" alt="Rate & Win Logo" />
      <h2>Rate & Win</h2>
    </div>
     <button class="hamburger" onclick="toggleMenu()">&#9776;</button>
    <nav class="desktop-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="restaurants.html">Restaurants</a>
      <a href="rewards.html">Rewards</a>
    </nav>
    <div class="header-actions">
      <button onclick="location.href='profile.html'">View Profile</button>
      <button onclick="logout()">Logout</button>
    </div>
    <div class="mobile-nav" id="mobileNav">
      <a href="dashboard.html">Dashboard</a>
      <a href="restaurants.html">Restaurants</a>
      <a href="rewards.html">Rewards</a>
      <button onclick="location.href='profile.html'">View Profile</button>
      <button onclick="logout()">Logout</button>
    </div>
  </header>

  <!-- Form -->
  <div class="form-container">
    <h2>Register a New Restaurant</h2>
    <form id="restaurantForm">
      <label for="name">Restaurant Name</label>
      <input type="text" id="name" required />

      <label for="country">Country</label>
      <select id="country" required>
        <option value="Ghana" selected>Ghana</option>
      </select>

      <label for="region">Region</label>
      <select id="region" required>
        <option value="">--Select Region--</option>
        <option value="Greater Accra">Greater Accra</option>
        <option value="Ashanti">Ashanti</option>
        <option value="Eastern">Eastern</option>
        <option value="Western">Western</option>
        <option value="Northern">Northern</option>
        <option value="Volta">Volta</option>
        <option value="Central">Central</option>
        <option value="Upper East">Upper East</option>
        <option value="Upper West">Upper West</option>
        <option value="Bono">Bono</option>
        <option value="Ahafo">Ahafo</option>
        <option value="Savannah">Savannah</option>
        <option value="North East">North East</option>
        <option value="Oti">Oti</option>
        <option value="Bono East">Bono East</option>
        <option value="Western North">Western North</option>
      </select>

      <label for="location">Location/Address</label>
      <input type="text" id="location" required />

      <label for="contact">Contact Number</label>
      <input type="tel" id="contact" required />

      <label for="cuisine">Type of Cuisine</label>
      <select id="cuisine" required>
        <option value="">--Select Cuisine--</option>
        <option value="Local">Local</option>
        <option value="Fast Food">Fast Food</option>
        <option value="Continental">Continental</option>
        <option value="Asian">Asian</option>
        <option value="Other">Other</option>
      </select>

      <label for="image">Upload Logo/Image</label>
      <input type="file" id="image" accept="image/*" />

      <label for="description">About/Description</label>
      <textarea id="description"></textarea>

      <div class="form-actions">
        <button class="submit-btn" type="submit">Submit</button>
        <button class="cancel-btn" type="button" onclick="location.href='dashboard.html'">Back</button>
      </div>
    </form>
  </div>

  <script>
    function logout() {
      localStorage.removeItem("loggedInUser");
      window.location.href = "index.html";
    }

    document.getElementById("restaurantForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const restaurant = {
        name: document.getElementById("name").value,
        country: document.getElementById("country").value,
        region: document.getElementById("region").value,
        location: document.getElementById("location").value,
        contact: document.getElementById("contact").value,
        cuisine: document.getElementById("cuisine").value,
        description: document.getElementById("description").value,
        image: ""
      };

      const imageInput = document.getElementById("image");
      const reader = new FileReader();
      reader.onload = function (event) {
        restaurant.image = event.target.result;
        saveRestaurant(restaurant);
      };

      if (imageInput.files[0]) {
        reader.readAsDataURL(imageInput.files[0]);
      } else {
        saveRestaurant(restaurant);
      }
    });

    function saveRestaurant(restaurant) {
      const restaurants = JSON.parse(localStorage.getItem("registeredRestaurants")) || [];
      restaurants.push(restaurant);
      localStorage.setItem("registeredRestaurants", JSON.stringify(restaurants));
      alert("Restaurant registered successfully!");
      window.location.href = "dashboard.html";
    }
    function toggleMenu() {
      document.getElementById("mobileNav").classList.toggle("active");
    }
  </script>
</body>
</html>
