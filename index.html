<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate & Win</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!--header/navigation-->

    <header class="header">
        <div class="logo">
            <img src="img/logo.png" alt="Rate & Win Logo">
            <h2>Rate & Win</h2>
        </div>
        <button class="hamburger" onclick="toggleMenu()">&#9776;</button>
        <nav class="desktop-nav">
            <a href="index.html">Home</a>
            <a href="restuarant.html">Restaurants</a>
            <a href="rewards.html">Rewards</a>
        </nav>
        <div class="auth-buttons">
            <button onclick="location.href='login.html'">Sign in</button>
            <button onclick="location.href='signup.html'">Sign up</button>
        </div>
        <div class="mobile-nav" id="mobileNav">
            <a href="index.html">Home</a>
            <a href="restuarant.html">Restaurants</a>
            <a href="rewards.html">Rewards</a>
            <button onclick="location.href='login.html'">Sign in</button>
            <button onclick="location.href='signup.html'">Sign up</button>
    </div>
    </header>

    <!--Hero Section-->

    <section class="hero">
        <h2>Welcome to Rate & Win</h2>
        <p>Share your restaurant experiences, earn reward points, and win exciting offers! Feedback has never been this fun and rewarding.</p>
        <button onclick="location.href='login.html'">Get started</button>
    </section>

    <!--Search Bar-->
    <section class="search-section">
        <input type="text" placeholder="search restaurants" name="search" id="searchinput">
        <button id="searchButton">Search</button>
    </section>

    <!--Recently Rated Restaurants-->

    <section class="ratings-section">
        <h3>Recently Rated</h3>
        <div class="restaurant-cards" id="recentRatings">

        </div>
    </section>

    <!--Footer-->

    <footer class="footer">
        <p>&copy; 2025 Rate & Win. All rights reserved</p>
    </footer>
    
    <script src="js/main.js"></script>
</body>
</html>
